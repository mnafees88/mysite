<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Max Connections Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            display: inline-block;
        }
        input {
            padding: 10px;
            width: 150px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            border: none;
            background: #28a745;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>RDS Max Connections Calculator</h2>
        <p>Enter DB Instance Memory (GB):</p>
        <input type="number" id="memoryGB" placeholder="Memory in GB">
        <br>
        <button onclick="calculateConnections()">Calculate</button>
        <h3 id="result"></h3>
    </div>

    <script>
        function calculateConnections() {
            let memoryGB = document.getElementById("memoryGB").value;
            if (memoryGB <= 0) {
                document.getElementById("result").innerText = "Please enter a valid memory size.";
                return;
            }
            let memoryBytes = memoryGB * 1024 * 1024 * 1024;
            let maxConnections = Math.floor(memoryBytes / 12582880);
            document.getElementById("result").innerText = `Max Connections: ${maxConnections}`;
        }
    </script>
</body>
</html>
